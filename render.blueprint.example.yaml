# Configuration template only — this file is not connected to Render and does
# not provision resources. Copy/adapt it after approving paid AI/worker hosting.
# Validate with: render blueprints validate
services:
  - type: pserv
    name: capstonex-ai
    runtime: docker
    region: oregon
    plan: starter # Requires an approved paid plan.
    rootDir: ai-service
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/ai/health
    envVars:
      - key: PORT
        value: "8000"
      - key: AI_INTERNAL_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: FAISS_INDEX_PATH
        value: /var/data/faiss_index
    disk:
      name: ai-data
      mountPath: /var/data
      sizeGB: 1

  - type: worker
    name: capstonex-agent-worker
    runtime: node
    region: oregon
    plan: starter # Requires an approved paid plan.
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm run worker
    envVars:
      - key: DATABASE_URL
        sync: false
      # Enter the private service URL manually, including its http:// scheme.
      # Render's hostport reference does not add a URL scheme.
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_INTERNAL_SECRET
        fromService:
          name: capstonex-ai
          type: pserv
          envVarKey: AI_INTERNAL_SECRET
      - key: AGENT_TEAM_TIMEOUT_MS
        value: "120000"
